[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=41.0.1",
  "setuptools>=77",
  "wheel>=0.37.1",
]

[project]
name = "vtool_ibeis"
description = "vision tools for IBEIS"
license = "Apache-2.0"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Jon Crall", email = "erotemic@gmail.com" },
  { name = "Jason Parham" },
  { name = "Hendrik Weideman" },
  { name = "Avi Weinstock" },
  { name = "Zackary Rutfield" },
  { name = "Chuck Stewart" },
]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dynamic = [
  "dependencies",
  "optional-dependencies",
  "version",
]
urls.Homepage = "https://github.com/Erotemic/vtool_ibeis"

[tool.setuptools]
include-package-data = true
dynamic.dependencies.file = [
  "requirements/runtime.txt",
]
dynamic.optional-dependencies.all.file = [
  "requirements/optional.txt",
  "requirements/headless.txt",
  "requirements/graphics.txt",
  "requirements/build.txt",
]
dynamic.optional-dependencies.build.file = [
  "requirements/build.txt",
]
dynamic.optional-dependencies.docs.file = [
  "requirements/docs.txt",
]
dynamic.optional-dependencies.graphics.file = [
  "requirements/graphics.txt",
]
dynamic.optional-dependencies.headless.file = [
  "requirements/headless.txt",
]
dynamic.optional-dependencies.optional.file = [
  "requirements/optional.txt",
]
dynamic.optional-dependencies.tests.file = [
  "requirements/tests.txt",
]
dynamic.readme.file = [
  "README.rst",
]
dynamic.readme.content-type = "text/x-rst"
dynamic.version.attr = "vtool_ibeis.__version__"
package-data."*" = [
  "requirements/*.txt",
]
packages.find.where = [
  ".",
]
packages.find.include = [
  "vtool_ibeis*",
]

[tool.uv]
# Supply-chain guard: ignore packages published too recently.
# Accepts a relative window (e.g. "P7D" / "30 days") or a fixed date.
exclude-newer = "P7D"

[tool.mypy]
ignore_missing_imports = true

[tool.pytest]
ini_options.addopts = "-p no:doctest --xdoctest --xdoctest-style=google --ignore-glob=setup.py --ignore-glob=dev --ignore-glob=docs"
ini_options.norecursedirs = ".git ignore build __pycache__ dev _skbuild docs"
ini_options.filterwarnings = [
  "default",
  "ignore:.*No cfgstr given in Cacher constructor or call.*:Warning",
  "ignore:.*Define the __nice__ method for.*:Warning",
  "ignore:.*private pytest class or function.*:Warning",
]

[tool.coverage]
run.branch = true
report.exclude_lines = [
  ".*  # nocover",
  ".*  # pragma: no cover",
  ".*if six.PY2:",
  "^ *pass *$",
  "^ *raise",
  "def __repr__",
  "if __name__ == .__main__.:",
  "if _debug:",
  "if 0:",
  "if trace is not None",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
  "verbose = .*",
]
report.omit = [
  "*/setup.py",
  "vtool_ibeis/__main__.py",
]

[tool.xcookie]
rel_mod_parent_dpath = "."
tags = [
  "purepy",
  "github",
  "erotemic",
  "cv2",
  "notypes",
]
mod_name = "vtool_ibeis"
repo_name = "vtool_ibeis"
url = "https://github.com/Erotemic/vtool_ibeis"
description = "vision tools for IBEIS"
os = [
  "linux",
  "win",
]
ci_pypy_versions = []
author = [
  "Jon Crall",
  "Jason Parham",
  "Hendrik Weideman",
  "Avi Weinstock",
  "Zackary Rutfield",
  "Chuck Stewart",
]
author_email = "erotemic@gmail.com"
min_python = "3.9"
max_python = "3.14"
version = "{mod_dpath}/__init__.py::__version__"
license = "Apache 2"
dev_status = "stable"
use_setup_py = false
use_pyproject_requirements = false
ci_pypi_trusted_publishing = true
enable_gpg = true
